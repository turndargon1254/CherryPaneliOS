name: Build iOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: .
        run: xcodegen generate

      - name: Build iOS App (unsigned)
        working-directory: .
        run: |
          xcodebuild -project CherryPanel.xcodeproj \
            -scheme CherryPanel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/CherryPanel.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet \
            archive

      - name: Create unsigned IPA (Payload)
        working-directory: .
        run: |
          mkdir -p build/ipa/Payload
          cp -R "build/CherryPanel.xcarchive/Products/Applications/CherryPanel.app" build/ipa/Payload/
          cd build/ipa
          zip -r CherryPanel.ipa Payload
          ls -la

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherrypanel-ios
          path: build/ipa/*.ipa
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/ipa/*.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
