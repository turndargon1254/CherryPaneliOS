name: Build iOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
          default: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Setup iOS Project
        working-directory: .
        run: |
          xcodebuild -resolvePackageDependencies -project CherryPanel.xcodeproj -scheme CherryPanel

      - name: Build iOS App
        working-directory: .
        run: |
          xcodebuild -project CherryPanel.xcodeproj \
            -scheme CherryPanel \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath ./build/CherryPanel.xcarchive \
            -quiet \
            archive

      - name: Export IPA
        working-directory: .
        run: |
          xcodebuild -exportArchive \
            -archivePath ./build/CherryPanel.xcarchive \
            -exportPath ./build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherrypanel-ios
          path: build/ipa/*.ipa
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/ipa/*.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
