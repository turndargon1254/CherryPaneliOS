name: CherryPanel
options:
  bundleIdPrefix: com.cherrypanel
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"

targets:
  CherryPanel:
    type: application
    platform: iOS
    sources:
      - path: CherryPanel
        excludes:
          - "WidgetExtension/**"
          - "Info.plist"
          - "ExportOptions.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cherrypanel.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CherryPanel/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: NO

  CherryPanelWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CherryPanel/WidgetExtension
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cherrypanel.app.WidgetExtension
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CherryPanel/WidgetExtension/Info.plist
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  CherryPanel:
    build:
      targets:
        CherryPanel: all
        CherryPanelWidget: [archive]
    run:
      config: Debug
    archive:
      config: Release
